<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
.stage{position:relative;width:1200px;height:630px;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:#eaf6fb;
 background:radial-gradient(900px 520px at 82% 12%,rgba(0,201,214,.28),transparent 60%),
 radial-gradient(760px 620px at 8% 108%,rgba(88,110,240,.30),transparent 55%),
 linear-gradient(135deg,#0b1a3a 0%,#12325a 48%,#0d4a55 100%)}
.wave{position:absolute;left:-40px;right:-40px;height:2px;background:rgba(120,210,230,.10)}
.left{position:absolute;left:66px;top:50px;width:700px}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font-size:21px;font-weight:800;letter-spacing:.14em;color:#7fe3ef;text-transform:uppercase}
.dot{width:12px;height:12px;border-radius:50%;background:#00d0e0;box-shadow:0 0 18px #00d0e0}
h1{font-size:84px;line-height:1.12;font-weight:900;letter-spacing:-.01em;margin:14px 0 0}
h1 em{font-style:normal;background:linear-gradient(90deg,#66e0ff,#8ea2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:27px;font-weight:700;color:#cfe8f2;margin-top:20px;line-height:1.55}
.chips{display:flex;gap:10px;margin-top:26px;flex-wrap:nowrap}
.chip{background:rgba(255,255,255,.08);border:1.5px solid rgba(140,220,235,.35);border-radius:14px;padding:9px 14px;font-size:19px;font-weight:800;white-space:nowrap}
.chip b{color:#ffd76a}
.foot{position:absolute;left:66px;bottom:42px;display:flex;align-items:center;gap:14px;font-size:26px;color:#a9c8d6}
.foot .jelly{font-size:38px;filter:drop-shadow(0 0 16px rgba(0,208,224,.5))}
.foot .url{font-weight:800;color:#eaf6fb}
.right{position:absolute;right:58px;top:0;bottom:0;width:360px;display:flex;flex-direction:column;justify-content:center;gap:16px;align-items:center}
.node{width:100%;background:rgba(10,26,50,.78);border:1.5px solid rgba(140,220,235,.4);border-radius:18px;padding:16px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.node .ic{font-size:32px}
.node .t{font-size:22px;font-weight:900;color:#eaf6fb;line-height:1.3}
.node .s{font-size:15px;font-weight:700;color:#9db8c6}
.arrow{font-size:32px;color:#7fe3ef;line-height:1}
.code{font-family:Menlo,Consolas,monospace;color:#7fe3ef}
</style></head><body><div class="stage">
<div class="wave" style="top:150px"></div><div class="wave" style="top:360px"></div><div class="wave" style="top:520px"></div>
<div class="left">
 <span class="eyebrow"><span class="dot"></span>VWork Blog ・ EXBRIDGE</span>
 <h1>話して、作って、<br><em>経営する</em>。</h1>
 <div class="sub">バイブコーディングの開発現場から、AIエージェントを軸にした経営、トークノミクスの思想と技術まで。</div>
 <div class="chips">
  <div class="chip">💬 バイブコーディング</div>
  <div class="chip">🤖 AIエージェント<b>経営</b></div>
  <div class="chip">🪙 トークノミクス</div>
 </div>
</div>
<div class="foot"><span class="jelly">🪼</span><span class="url">katsushi2441.github.io/vwork</span></div>
<div class="right">
 <div class="node"><span class="ic">💬</span><div><div class="t">「作りたい」を話す</div><div class="s">仕様は会話で決まる</div></div></div>
 <div class="arrow">↓</div>
 <div class="node"><span class="ic">⌨️</span><div><div class="t"><span class="code">AIが実装する</span></div><div class="s">開発も運用もエージェント</div></div></div>
 <div class="arrow">↓</div>
 <div class="node"><span class="ic">📈</span><div><div class="t">事業が動き出す</div><div class="s">収益はトークンで還元へ</div></div></div>
</div>
</div></body></html>
