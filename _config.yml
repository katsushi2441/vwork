title: VWork バイブコーディングフレームワーク
description: VWorkは、バイブコーディングを企業内に導入するための作業基盤、実践知、ブログです。
url: "https://katsushi2441.github.io"
baseurl: "/vwork"
lang: ja
author: 株式会社エクスブリッジ
seo_image: "https://exbridge.jp/images/vwork-banner.png"
theme: null
markdown: kramdown
exclude:
  - .git
  - .github
  - packages
  - pyproject.toml
  - LICENSE
defaults:
  - scope:
      path: ""
    values:
      layout: default
  # VWork Blogの全記事はblog専用OGP画像(記事frontmatterのimage:が無い場合の既定)。
  # publish.pyのテンプレートは配信に使われておらず(Jekyllが生成)、ここが実際に効く場所。
  - scope:
      path: "blog"
    values:
      image: "https://exbridge.jp/images/vwork-blog-ogp.png"
  # AI OSS技術解説(articles/)は専用OGP。無いとサイト既定のvwork-banner(VWorkフレームワーク画像)に
  # フォールバックし、記事の中身(OSS日本語化・本家貢献・セルフホスト)と合わない(2026-09-03修正)。
  - scope:
      path: "articles"
    values:
      image: "https://exbridge.jp/images/oss-articles-ogp.png"
